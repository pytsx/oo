[project]
name = "news-machine"
version = "0.1.0"
description = "Pipeline rastreavel para compreender transmissoes e desenvolver historias jornalisticas"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pydantic>=2.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
perception = ["faster-whisper", "imageio-ffmpeg", "numpy", "yt-dlp"]
dev = ["pytest>=8"]

[project.scripts]
news-machine = "news_machine.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]


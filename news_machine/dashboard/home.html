<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsroom OS — Transmissões</title><link rel="stylesheet" href="/assets/product.css"><link rel="stylesheet" href="/assets/desktop.css"></head>
<body class="product modern-home daw-home"><header class="topbar"><a class="brand" href="/"><b>N</b><span>Newsroom OS<small>audio intelligence</small></span></a><nav><a href="/operations">Infraestrutura</a><span id="clock"></span></nav></header>
<main class="home-shell"><section class="hero"><div><p class="kicker">BIBLIOTECA DE PROJETOS</p><h1>Sessões de áudio e transmissão</h1><p>Gerencie fontes, acesse gravações e abra suas sessões de transcrição no editor multitrilha.</p></div><button class="primary big" id="new-stream">+ Nova sessão</button></section>
<section class="section-head"><div><h2>Projetos recentes</h2><p id="summary">Carregando ambiente…</p></div><div class="segmented"><button class="selected" data-filter="all">Todas</button><button data-filter="active">Ao vivo</button><button data-filter="archive">Arquivo</button></div></section>
